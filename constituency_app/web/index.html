<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Constituency AI Command Center - AI-Powered Citizen Grievance Redressal and Resource Planning for Indian MPs.">
  <meta name="keywords" content="AI, Governance, India, Constituency, Grievance, Gemini, Firebase, Flutter">
  <meta name="author" content="Constituency AI Team">

  <!-- Mobile Viewport & Theme -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B57D0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Constituency AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Constituency AI Command Center / जन सेवा AI</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Styling for the loading state before Flutter takes over */
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAFD;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading-container {
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #E0E0E0;
      border-top: 4px solid #0B57D0;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      color: #0B57D0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <!-- Fallback Semantic HTML for Screen Readers and Lighthouse -->
  <main class="loading-container" id="loading-indicator" role="main" aria-label="Constituency AI Application">
    <div class="spinner" aria-hidden="true"></div>
    <div class="loading-text">Constituency AI / जन सेवा AI Loading...</div>
  </main>

  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js and initialize Flutter engine
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: {{flutter_service_worker_version}},
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            // Remove the loading spinner once app is ready
            var loadingEl = document.getElementById("loading-indicator");
            if (loadingEl) {
              loadingEl.remove();
            }
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
